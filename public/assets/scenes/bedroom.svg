<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="none">
  <rect width="800" height="600" fill="#E0E7FF"/> <!-- Wall -->
  <rect x="0" y="450" width="800" height="150" fill="#9CA3AF"/> <!-- Floor -->
  <!-- Window -->
  <rect x="500" y="100" width="200" height="250" fill="#93C5FD" stroke="#1E3A8A" stroke-width="10"/>
  <line x1="600" y1="100" x2="600" y2="350" stroke="#1E3A8A" stroke-width="10"/>
  <line x1="500" y1="225" x2="700" y2="225" stroke="#1E3A8A" stroke-width="10"/>
  <!-- Bed -->
  <rect x="50" y="350" width="300" height="100" fill="#8B5CF6"/>
  <rect x="50" y="280" width="40" height="170" fill="#5B21B6"/> <!-- Headboard -->
  <rect x="90" y="320" width="80" height="40" fill="#FFFFFF" rx="10"/> <!-- Pillow -->
  <!-- Poster -->
  <rect x="150" y="100" width="120" height="160" fill="#FBBF24"/>
  <circle cx="210" cy="180" r="30" fill="#EF4444"/>
</svg>
